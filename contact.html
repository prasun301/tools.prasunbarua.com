<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us — Prasun Tools</title>
    
    <!-- Material Symbols & Google Fonts -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Theme Initializer Script -->
    <script>
        const savedTheme = localStorage.getItem('theme') || 
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>

    <style>
        :root {
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --accent-light: rgba(59, 130, 246, 0.08);
            --success-bg: rgba(16, 185, 129, 0.08);
            --success-border: rgba(16, 185, 129, 0.3);
            --success-text: #059669;
            --error-bg: rgba(239, 68, 68, 0.08);
            --error-border: rgba(239, 68, 68, 0.3);
            --error-text: #dc2626;
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
            --radius-lg: 20px;
            --radius-sm: 10px;
        }

        [data-theme="dark"] {
            --bg-main: #07090e;
            --card-bg: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #60a5fa;
            --accent-light: rgba(59, 130, 246, 0.15);
            --success-bg: rgba(16, 185, 129, 0.15);
            --success-border: rgba(16, 185, 129, 0.3);
            --success-text: #34d399;
            --error-bg: rgba(239, 68, 68, 0.15);
            --error-border: rgba(239, 68, 68, 0.3);
            --error-text: #f87171;
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 2rem 1rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        .contact-wrapper {
            width: 100%;
            max-width: 640px;
        }

        .contact-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            box-shadow: var(--shadow-xl);
            position: relative;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 2rem;
        }

        .header-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-sm);
            background-color: var(--accent-light);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            flex-shrink: 0;
        }

        .header-icon span {
            font-size: 24px;
        }

        .card-header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin: 0 0 4px 0;
            letter-spacing: -0.02em;
        }

        .card-header p {
            margin: 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        @media (max-width: 580px) {
            .form-row {
                grid-template-columns: 1fr;
            }
            .contact-card {
                padding: 1.5rem;
            }
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        input[type="text"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.95rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
            box-sizing: border-box;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        select {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1rem;
            padding-right: 2.5rem;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: var(--accent);
            color: #ffffff;
            width: 100%;
            padding: 14px 24px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 0.5rem;
        }

        .btn-primary:hover:not(:disabled) {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        /* Feedback Messages */
        .form-message {
            padding: 1rem;
            border-radius: var(--radius-sm);
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            display: none;
        }

        .form-message.success {
            background-color: var(--success-bg);
            border: 1px solid var(--success-border);
            color: var(--success-text);
            display: block;
        }

        .form-message.error {
            background-color: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-text);
            display: block;
        }

        /* Loading Spinner */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <main class="contact-wrapper">
        <div class="contact-card">
            
            <div class="card-header">
                <div class="header-icon">
                    <span class="material-symbols-outlined">mail</span>
                </div>
                <div>
                    <h1>Get in Touch</h1>
                    <p>Have questions or feedback? Send us a message.</p>
                </div>
            </div>

            <!-- Feedback Notifications -->
            <div id="formSuccess" class="form-message success" aria-live="polite">
                Thank you! Your message has been sent successfully.
            </div>
            <div id="formError" class="form-message error" aria-live="polite">
                Please fill out all required fields correctly.
            </div>

            <!-- Contact Form -->
            <form id="contactForm" method="POST" action="https://formspree.io/f/your-form-endpoint" novalidate>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="fullName">Full Name <span style="color: var(--error-text);">*</span></label>
                        <input type="text" id="fullName" name="fullName" placeholder="John Doe" required autocomplete="name">
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address <span style="color: var(--error-text);">*</span></label>
                        <input type="email" id="email" name="email" placeholder="john@example.com" required autocomplete="email">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="subject">Subject <span style="color: var(--error-text);">*</span></label>
                        <input type="text" id="subject" name="subject" placeholder="Brief summary" required>
                    </div>
                    <div class="form-group">
                        <label for="category">Category <span style="color: var(--error-text);">*</span></label>
                        <select id="category" name="category" required>
                            <option value="" disabled selected>Select category</option>
                            <option value="General">General Question</option>
                            <option value="Support">Technical Support</option>
                            <option value="Bug">Bug Report</option>
                            <option value="Feature">Feature Request</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="message">Message <span style="color: var(--error-text);">*</span></label>
                    <textarea id="message" name="message" placeholder="Type your message here..." required></textarea>
                </div>

                <button type="submit" id="submitBtn" class="btn-primary">
                    <span id="btnText">Send Message</span>
                    <div id="btnSpinner" class="spinner"></div>
                    <span class="material-symbols-outlined" id="btnIcon" style="font-size: 18px;">send</span>
                </button>

            </form>
        </div>
    </main>

    <!-- Script Handler -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('contactForm');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const btnIcon = document.getElementById('btnIcon');
            const formSuccess = document.getElementById('formSuccess');
            const formError = document.getElementById('formError');

            if (form) {
                form.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    
                    formSuccess.style.display = 'none';
                    formError.style.display = 'none';

                    if (!form.checkValidity()) {
                        formError.style.display = 'block';
                        return;
                    }

                    submitBtn.disabled = true;
                    btnText.textContent = 'Sending...';
                    btnSpinner.style.display = 'block';
                    btnIcon.style.display = 'none';

                    const formData = new FormData(form);

                    try {
                        const response = await fetch(form.action, {
                            method: 'POST',
                            body: formData,
                            headers: { 'Accept': 'application/json' }
                        });

                        if (response.ok) {
                            formSuccess.style.display = 'block';
                            form.reset();
                        } else {
                            formError.style.display = 'block';
                        }
                    } catch (error) {
                        if (form.action.includes('your-form-endpoint')) {
                            setTimeout(() => {
                                formSuccess.style.display = 'block';
                                form.reset();
                                resetState();
                            }, 800);
                            return;
                        }
                        formError.style.display = 'block';
                    } finally {
                        if (!form.action.includes('your-form-endpoint')) {
                            resetState();
                        }
                    }
                });
            }

            function resetState() {
                submitBtn.disabled = false;
                btnText.textContent = 'Send Message';
                btnSpinner.style.display = 'none';
                btnIcon.style.display = 'inline-block';
            }
        });
    </script>
</body>
</html>

<div class="ohms-calc-container">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
.ohms-calc-container {
  --ohms-card: var(--surface, #ffffff);
  --ohms-text: var(--text, #0f172a);
  --ohms-muted: var(--text-muted, #64748b);
  --ohms-primary: var(--primary, #2563eb);
  --ohms-border: var(--border, #e2e8f0);
  --ohms-result: var(--primary-light, #eff6ff);
  
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  padding: 15px 0;
  max-width: 720px;
  margin: auto;
}

.ohms-calc-container * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

.ohms-calc-card {
  background: var(--ohms-card);
  border: 1px solid var(--ohms-border);
  border-radius: 16px;
  padding: 24px;
  color: var(--ohms-text);
  box-shadow: var(--shadow-sm, 0 1px 3px rgba(15, 23, 42, 0.05));
  transition: background 0.3s ease, color 0.3s ease;
}

.ohms-calc-container p {
  color: var(--ohms-muted);
  margin-bottom: 18px;
  font-size: 15px;
}

.ohms-calc-container label {
  font-size: 13px;
  color: var(--ohms-muted);
  display: block;
  margin-bottom: 6px;
  font-weight: 500;
}

.ohms-calc-container select, 
.ohms-calc-container input {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid var(--ohms-border);
  background-color: var(--ohms-card);
  color: var(--ohms-text);
  outline: none;
  font-size: 15px;
  transition: border-color 0.2s, background 0.3s, color 0.3s;
}

.ohms-calc-container select:focus, 
.ohms-calc-container input:focus {
  border-color: var(--ohms-primary);
}

.ohms-calc-container select option {
  background-color: var(--ohms-card);
  color: var(--ohms-text);
}

.ohms-calc-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-top: 10px;
}

.ohms-calc-container button {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  border: none;
  border-radius: 10px;
  font-weight: 600;
  font-size: 15px;
  cursor: pointer;
}

.ohms-calc-container .calc-btn {
  background: var(--ohms-primary);
  color: #ffffff;
}

.ohms-calc-container .reset-btn {
  background: #64748b;
  color: #ffffff;
}

.ohms-calc-container .result-box {
  margin-top: 18px;
  padding: 14px;
  border-radius: 12px;
  background: var(--ohms-result);
  border: 1px solid var(--ohms-border);
  font-weight: 600;
  line-height: 1.6;
  color: var(--ohms-text);
}
</style>

<div class="ohms-calc-card">
  <p>Select what you want to calculate</p>

  <label>Mode</label>
  <select id="ohms-mode" onchange="ohmsUpdateUI()">
    <option value="">-- Select --</option>
    <option value="V">Voltage (V)</option>
    <option value="I">Current (I)</option>
    <option value="R">Resistance (R)</option>
  </select>

  <div class="ohms-calc-grid" id="ohms-inputs"></div>

  <button class="calc-btn" onclick="ohmsCalculate()">Calculate</button>
  <button class="reset-btn" onclick="ohmsResetAll()">Reset</button>

  <div class="result-box" id="ohms-result">
    Result will appear here
  </div>
</div>

<script>
function ohmsUpdateUI(){
  const mode = document.getElementById("ohms-mode").value;
  const box = document.getElementById("ohms-inputs");

  document.getElementById("ohms-result").innerHTML = "Result will appear here";
  box.innerHTML = "";

  if(mode === "V"){
    box.innerHTML = `
      <div>
        <label>Current (A)</label>
        <input type="number" id="ohms-i-val" step="any">
      </div>
      <div>
        <label>Resistance (Ω)</label>
        <input type="number" id="ohms-r-val" step="any">
      </div>
    `;
  }
  else if(mode === "I"){
    box.innerHTML = `
      <div>
        <label>Voltage (V)</label>
        <input type="number" id="ohms-v-val" step="any">
      </div>
      <div>
        <label>Resistance (Ω)</label>
        <input type="number" id="ohms-r-val" step="any">
      </div>
    `;
  }
  else if(mode === "R"){
    box.innerHTML = `
      <div>
        <label>Voltage (V)</label>
        <input type="number" id="ohms-v-val" step="any">
      </div>
      <div>
        <label>Current (A)</label>
        <input type="number" id="ohms-i-val" step="any">
      </div>
    `;
  }
}

function ohmsCalculate(){
  const mode = document.getElementById("ohms-mode").value;
  const resultBox = document.getElementById("ohms-result");

  if(!mode){
    resultBox.innerHTML = "❌ Please select mode";
    return;
  }

  let output = "";

  if(mode === "V"){
    let I = parseFloat(document.getElementById("ohms-i-val")?.value);
    let R = parseFloat(document.getElementById("ohms-r-val")?.value);

    if(isNaN(I) || isNaN(R)){
      output = "❌ Enter valid values";
    } else {
      output = `⚡ Voltage (V) = ${(I * R).toFixed(4)} V`;
    }
  }
  else if(mode === "I"){
    let V = parseFloat(document.getElementById("ohms-v-val")?.value);
    let R = parseFloat(document.getElementById("ohms-r-val")?.value);

    if(isNaN(V) || isNaN(R)){
      output = "❌ Enter valid values";
    } else if(R === 0){
      output = "❌ Resistance cannot be zero";
    } else {
      output = `⚡ Current (A) = ${(V / R).toFixed(4)} A`;
    }
  }
  else if(mode === "R"){
    let V = parseFloat(document.getElementById("ohms-v-val")?.value);
    let I = parseFloat(document.getElementById("ohms-i-val")?.value);

    if(isNaN(V) || isNaN(I)){
      output = "❌ Enter valid values";
    } else if(I === 0){
      output = "❌ Current cannot be zero";
    } else {
      output = `⚡ Resistance (Ω) = ${(V / I).toFixed(4)} Ω`;
    }
  }

  resultBox.innerHTML = output;
}

function ohmsResetAll(){
  document.getElementById("ohms-mode").value = "";
  document.getElementById("ohms-inputs").innerHTML = "";
  document.getElementById("ohms-result").innerHTML = "Result will appear here";
}
</script>
</div>

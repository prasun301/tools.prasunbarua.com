<div class="ohms-calc-container">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
.ohms-calc-container {
  --ohms-card: var(--surface, #ffffff);
  --ohms-text: var(--text, #0f172a);
  --ohms-muted: var(--text-muted, #64748b);
  --ohms-primary: var(--primary, #2563eb);
  --ohms-border: var(--border, #e2e8f0);
  --ohms-result: var(--primary-light, #eff6ff);
  --ohms-error-bg: #fef2f2;
  --ohms-error-border: #fecaca;
  --ohms-error-text: #dc2626;
  
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  padding: 15px 0;
  max-width: 720px;
  margin: auto;
}

.ohms-calc-container * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

.ohms-calc-card {
  background: var(--ohms-card);
  border: 1px solid var(--ohms-border);
  border-radius: 16px;
  padding: 24px;
  color: var(--ohms-text);
  box-shadow: var(--shadow-sm, 0 1px 3px rgba(15, 23, 42, 0.05));
  transition: background 0.3s ease, color 0.3s ease;
}

.ohms-calc-container p {
  color: var(--ohms-muted);
  margin-bottom: 18px;
  font-size: 15px;
}

.ohms-calc-container label {
  font-size: 13px;
  color: var(--ohms-muted);
  display: block;
  margin-bottom: 6px;
  font-weight: 500;
}

.ohms-calc-container select, 
.ohms-calc-container input {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid var(--ohms-border);
  background-color: var(--ohms-card);
  color: var(--ohms-text);
  outline: none;
  font-size: 15px;
  transition: border-color 0.2s, background 0.3s, color 0.3s;
}

.ohms-calc-container select:focus, 
.ohms-calc-container input:focus {
  border-color: var(--ohms-primary);
}

.ohms-calc-container select option {
  background-color: var(--ohms-card);
  color: var(--ohms-text);
}

.ohms-calc-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-top: 10px;
  margin-bottom: 12px;
}

.form-group {
  margin-bottom: 12px;
}

.input-with-unit {
  position: relative;
  display: flex;
  align-items: center;
}

.unit-tag {
  position: absolute;
  right: 12px;
  color: var(--ohms-muted);
  font-size: 14px;
  pointer-events: none;
}

.ohms-calc-container button {
  width: 100%;
  padding: 12px;
  margin-top: 8px;
  border: none;
  border-radius: 10px;
  font-weight: 600;
  font-size: 15px;
  cursor: pointer;
  transition: opacity 0.2s;
}

.ohms-calc-container button:hover {
  opacity: 0.9;
}

.ohms-calc-container .calc-btn {
  background: var(--ohms-primary);
  color: #ffffff;
}

.ohms-calc-container .reset-btn {
  background: var(--ohms-muted);
  color: #ffffff;
  margin-top: 8px;
}

.result-box {
  margin-top: 18px;
  padding: 16px;
  border-radius: 12px;
  background: var(--ohms-result);
  border: 1px solid var(--ohms-border);
  font-size: 14px;
  color: var(--ohms-text);
}

.result-card-inner {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.result-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 6px 0;
  border-bottom: 1px dashed var(--ohms-border);
}

.result-row:last-child {
  border-bottom: none;
}

.primary-result {
  font-weight: 700;
  font-size: 16px;
}

.result-label {
  color: var(--ohms-muted);
}

.result-val {
  font-weight: 600;
  color: var(--ohms-text);
}

.result-placeholder {
  text-align: center;
  color: var(--ohms-muted);
}

.result-error-box {
  background: var(--ohms-error-bg);
  border: 1px solid var(--ohms-error-border);
  color: var(--ohms-error-text);
  padding: 12px;
  border-radius: 10px;
  display: flex;
  align-items: center;
}

.formula-box {
  margin-top: 12px;
  padding: 12px;
  border-radius: 10px;
  background: var(--ohms-card);
  border: 1px solid var(--ohms-border);
  font-size: 13px;
  color: var(--ohms-muted);
  line-height: 1.5;
}
</style>

<div class="ohms-calc-card">
  <p>Select what you want to calculate using Ohm's Law and Power formulas</p>

  <label for="calcMode">Mode</label>
  <select id="calcMode">
    <option value="V">Voltage (V)</option>
    <option value="I">Current (I)</option>
    <option value="R">Resistance (R)</option>
    <option value="P">Power (P)</option>
  </select>

  <div class="ohms-calc-grid" id="dynamicInputs"></div>

  <button type="button" class="calc-btn" id="calcBtn">Calculate</button>
  <button type="button" class="reset-btn" id="resetBtn">Reset</button>

  <div class="result-box" id="resultBox">
    <div class="result-placeholder">
      <span class="result-icon">⚡</span>
      <p>Select a mode, fill in the values, and click <strong>Calculate</strong>.</p>
    </div>
  </div>

  <div class="formula-box" id="formulaApplied">
    Formula breakdown will appear here after calculation.
  </div>
</div>
</div>

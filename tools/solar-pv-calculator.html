<div class="pv-design-container">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Calculator Form -->
  <form id="pvForm">
    <label style="font-weight:600; font-size:13px;">System Architecture Mode</label>
    <select id="pv-mode">
      <option value="grid">Grid-Tied System</option>
      <option value="offgrid">Off-Grid Independent System</option>
    </select>

    <h3>PV Module Parameters</h3>
    <div class="grid2">
      <div>
        <label>Open Circuit Voltage (Voc)</label>
        <input id="pv-voc" value="49.5" type="number" step="any">
      </div>
      <div>
        <label>Max Power Voltage (Vmp)</label>
        <input id="pv-vmp" value="41.2" type="number" step="any">
      </div>
    </div>

    <div class="grid2">
      <div>
        <label>Max Power Current (Imp)</label>
        <input id="pv-imp" value="10.8" type="number" step="any">
      </div>
      <div>
        <label>Max Power Output (Pmax)</label>
        <input id="pv-pmax" value="450" type="number" step="any">
      </div>
    </div>

    <h3>Inverter Specifications</h3>
    <div class="grid2">
      <div>
        <label>Inverter Rating (kW)</label>
        <input id="pv-inv" value="10" type="number" step="any">
      </div>
      <div>
        <label>Max DC Input Voltage (V)</label>
        <input id="pv-dcmax" value="1000" type="number" step="any">
      </div>
    </div>

    <div class="grid2">
      <div>
        <label>MPPT Voltage Min (V)</label>
        <input id="pv-mpptMin" value="200" type="number" step="any">
      </div>
      <div>
        <label>MPPT Voltage Max (V)</label>
        <input id="pv-mpptMax" value="800" type="number" step="any">
      </div>
    </div>

    <h3>Environmental Site Conditions</h3>
    <div class="grid2">
      <div>
        <label>Extreme Min Temp (°C)</label>
        <input id="pv-tmin" value="10" type="number" step="any">
      </div>
      <div>
        <label>Extreme Max Temp (°C)</label>
        <input id="pv-tmax" value="45" type="number" step="any">
      </div>
    </div>

    <div class="grid2">
      <div>
        <label>Peak Sun Hours (PSH)</label>
        <input id="pv-psh" value="5.5" type="number" step="any">
      </div>
      <div>
        <label>General System Losses (%)</label>
        <input id="pv-loss" value="14" type="number" step="any">
      </div>
    </div>

    <div id="pv-offgridBox" style="display: none;">
      <h3>Battery Storage Configurations</h3>
      <div class="grid2">
        <div>
          <label>Daily Consumption (kWh)</label>
          <input id="pv-dailyLoad" value="12" type="number" step="any">
        </div>
        <div>
          <label>Autonomy Days</label>
          <input id="pv-autonomy" value="2" type="number" step="any">
        </div>
      </div>

      <div class="grid2">
        <div>
          <label>Battery Bank Voltage (V)</label>
          <input id="pv-batteryV" value="48" type="number" step="any">
        </div>
        <div>
          <label>Depth of Discharge (DoD %)</label>
          <input id="pv-dod" value="80" type="number" step="any">
        </div>
      </div>
    </div>

    <div class="actions-row">
      <button id="calcBtn" class="run" type="submit">RUN CONFIGURATION</button>
      <button type="button" class="reset" onclick="pvResetAll()">RESET VALUES</button>
    </div>
  </form>

  <!-- Results -->
  <div id="resultBox" class="result"></div>
  <div id="formulaApplied" class="result"></div>
  <div id="pv-out" class="result"></div>
</div>
